name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ../.github/scripts/run.sh "npm ci" npm ci
      - run: ../.github/scripts/run.sh "lint" npm run lint
      - run: ../.github/scripts/run.sh "typecheck" npm run typecheck
      - run: ../.github/scripts/run.sh "test" npm test
      - run: ../.github/scripts/run.sh "build" npm run build
        env:
          API_INTERNAL_URL: http://localhost:8080

  backend:
    name: Backend (test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # verify = 编译 + 单元/集成测试（H2）+ 打包
      - run: ../.github/scripts/run.sh "maven" mvn -B -ntp verify

  compose:
    name: Docker compose build + E2E smoke test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - run: .github/scripts/run.sh "compose build" docker compose build
      - run: .github/scripts/run.sh "compose up" docker compose up -d --wait --wait-timeout 300
      - run: .github/scripts/run.sh "e2e" .github/scripts/e2e.sh
      - if: failure()
        run: .github/scripts/run.sh "compose logs" sh -c 'docker compose logs --no-color --tail=80 backend frontend; exit 1'
      - if: always()
        run: docker compose down -v
