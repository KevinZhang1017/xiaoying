server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: mockstudio-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mockstudio?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:mockstudio}
    password: ${DB_PASSWORD:mockstudio}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 全局硬上限；模板级大小限制在业务层校验，以便返回可理解的错误
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  storage:
    root: ${STORAGE_ROOT:./data/files}
  executor:
    core-pool-size: ${EXECUTOR_CORE_POOL_SIZE:2}
    max-pool-size: ${EXECUTOR_MAX_POOL_SIZE:2}
    queue-capacity: ${EXECUTOR_QUEUE_CAPACITY:100}
  auth:
    cookie-name: ms_session
    cookie-secure: ${COOKIE_SECURE:false}
    session-ttl: 7d
  demo-users:
    enabled: ${DEMO_USERS_ENABLED:true}
    password: ${DEMO_USER_PASSWORD:demo1234}
  dev-api:
    # 开发/演示接口 /api/dev/**，用于调整模拟耗时与指定阶段失败
    enabled: ${DEV_API_ENABLED:false}
  simulation:
    # 每个阶段的模拟耗时（毫秒）
    delays-ms:
      ASSET_CHECK: ${SIM_DELAY_ASSET_CHECK_MS:1500}
      GENERATE: ${SIM_DELAY_GENERATE_MS:4000}
      FINALIZE: ${SIM_DELAY_FINALIZE_MS:1500}
    # 可选：ASSET_CHECK / GENERATE / FINALIZE，留空表示不注入失败
    fail-stage: ${SIM_FAIL_STAGE:}

logging:
  level:
    com.mockstudio: INFO
